<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kantarell">
  <!--
    Kantarellen från appens egna artikoner, ritad för 512 px i stället för 24.
    Samma silhuett — vågig tratt, solid avsmalnande fot — men med kurvor som
    tål att förstoras: silhuetten är elva bézierkurvor, inte tusen punkter.

    Två toner. Grundgulet (#f2b705, appens guld) bär formen ända ner till
    16 px; kantbandet (#ffd24a, guld-ljus) ger tratten en kant från 40 px och
    uppåt och tonar bort under det. Allt utom silhuetten är alltså dekor som
    får försvinna — därför inga skivor: hårfina streck blir repor vid 24 px,
    vilket var precis vad den gamla ikonen led av.

    Motivet ligger innanför radien 200 px från mitten, så det klarar både
    iOS:ligt hörnavrundad kvadrat och Androids runda och squircle-masker.
  -->
  <rect width="512" height="512" rx="114" fill="#0d1310" />
  <clipPath id="innanfor">
    <!-- Samma väg som silhuetten. Håller kantbandet inne i svampen. -->
    <path d="M 118 144
      C 146 138 168 152 192 162
      C 216 172 232 172 252 166
      C 276 159 296 140 322 138
      C 348 136 372 152 396 150
      C 418 148 424 168 408 186
      C 376 224 340 262 304 302
      C 304 336 302 368 298 392
      C 296 416 218 416 216 392
      C 212 368 210 336 210 302
      C 176 260 142 222 110 196
      C 84 176 88 150 118 144 Z" />
  </clipPath>
  <g transform="translate(2 -18)">
    <!-- Hela svampen i den ljusa tonen; kroppen läggs sedan över. -->
    <path fill="#ffd24a" d="M 118 144
      C 146 138 168 152 192 162
      C 216 172 232 172 252 166
      C 276 159 296 140 322 138
      C 348 136 372 152 396 150
      C 418 148 424 168 408 186
      C 376 224 340 262 304 302
      C 304 336 302 368 298 392
      C 296 416 218 416 216 392
      C 212 368 210 336 210 302
      C 176 260 142 222 110 196
      C 84 176 88 150 118 144 Z" />
    <g clip-path="url(#innanfor)">
      <!--
        Kroppen under trattens kant. Ritad som yta i stället för som bred
        linje: en linje som svänger runt spetsarna viker sin egen insida och
        lämnar hack i kanten, en yta har bara den kant man ritar.
      -->
      <path fill="#f2b705" d="M 40 214
      C 70 200 96 190 122 192
      C 152 194 176 206 196 212
      C 220 219 234 219 254 214
      C 278 208 298 190 324 188
      C 350 186 374 202 398 200
      C 420 198 448 206 470 216
      L 470 620 L 40 620 Z" />
    </g>
  </g>
</svg>
